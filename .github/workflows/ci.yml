name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Lint and type debt is being burned down by the architecture roadmap
# (docs/architecture-roadmap-2026-11-21/). Until AR009 records the ratchet
# baseline and flips the full-repo gates to blocking, the full-repo runs report
# and the changed-file / strict-island gates enforce.
env:
  RUFF_SELECT: "E,F,I,B,UP,SIM,RUF"

jobs:
  lint:
    name: ruff (changed files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6"

      - name: Collect changed Python files
        id: changed
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE}" ] || [[ "${BASE}" =~ ^0+$ ]]; then
            BASE="HEAD~1"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "${BASE}" >/dev/null 2>&1 || true
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          git diff --name-only --diff-filter=ACMR "${BASE}...HEAD" -- '*.py' > /tmp/changed.txt || true
          COUNT="$(grep -c . /tmp/changed.txt || true)"
          echo "count=${COUNT}" >> "${GITHUB_OUTPUT}"
          echo "Changed Python files: ${COUNT}"

      - name: Ruff on changed files
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -t FILES < /tmp/changed.txt
          ruff check --select "${RUFF_SELECT}" --ignore E501 "${FILES[@]}"

      - name: Ruff full-repo report (non-blocking until AR009)
        continue-on-error: true
        run: ruff check --select "${RUFF_SELECT}" --ignore E501 . --statistics

      - name: Encoding integrity (no U+FFFD, AR005)
        run: |
          python -I - <<'PY'
          import pathlib, sys
          bad = []
          files = sorted(pathlib.Path('src').rglob('*.py')) + [pathlib.Path('pyproject.toml')]
          for p in files:
              t = p.read_text(encoding='utf-8', errors='strict')
              if '\ufffd' in t:
                  bad.append(str(p))
          for b in bad:
              print('U+FFFD in', b)
          sys.exit(1 if bad else 0)
          PY

      # AR011: report-only for one release, then flip continue-on-error off.
      - name: pip-audit (dependency CVEs, report-only)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7"
          python -m pip_audit -r constraints.txt --progress-spinner off

      - name: Plugin-lock SBOM (15 pinned analyzers, AR011)
        run: |
          python tools/generate_release_sbom.py --check sbom.json
          rm sbom.json

  types:
    name: mypy (strict island + report)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and type checker
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # These modules are already clean under the [tool.mypy] settings and are
      # the seed of the strict island. Add modules as they reach zero errors;
      # never remove one to make a build pass.
      - name: mypy strict island (blocking)
        run: |
          mypy --follow-imports=silent \
            src/attackmap/safe_fs.py \
            src/attackmap/redact.py \
            src/attackmap/merge.py \
            src/attackmap/evidence.py \
            src/attackmap/finding_identity.py \
            src/attackmap/srcpaths.py \
            src/attackmap/taxonomy.py \
            src/attackmap/signal_provenance.py \
            src/attackmap/md.py \
            src/attackmap/progress.py

      - name: mypy full package report (non-blocking; ratchet tracks the count)
        continue-on-error: true
        run: mypy src/attackmap

  test-fast:
    name: pytest fast (linux, xdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node for frontend regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llm,dev]"

      # AR008 marked the suite (unit/integration/contract/live); the fast leg
      # runs the pure tier plus the SDK/merge/artifact contracts. AC-003:
      # < 5 minutes, no test over 120 s. The coverage floor comes from the
      # AR009 baseline (AC-004) and may only be tightened.
      - name: Run fast suite in parallel
        run: |
          node --version
          python -m pytest -q -ra -m "unit or contract" -n auto --timeout=120 --cov=attackmap --cov-report=term --cov-fail-under=21

  test-full:
    name: pytest (full matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node for frontend regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llm,dev]"

      - name: Run tests
        run: |
          node --version
          python -m pytest -q -ra -m "not live"

  test-live:
    # AC-013 adjacent (AGENTS.md): real LM Studio integration runs against the
    # local endpoint on the runner; manual or nightly only, never on PRs.
    name: pytest live (LM Studio, opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llm,dev]"

      - name: Run live tests
        run: python -m pytest -q -ra -m live --timeout=600
        env:
          ATTACKMAP_LLM_BASE_URL: ${{ vars.ATTACKMAP_LLM_BASE_URL || 'http://127.0.0.1:1234/v1' }}

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test-full
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  windows-build:
    name: Windows frozen build + smoke tests
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install "pyinstaller>=6.0"

      - name: Build Windows EXE
        run: installer\build-installer.bat
        shell: cmd

      - name: Run frozen smoke tests
        run: installer\smoke-tests.ps1
        shell: pwsh

      - name: Upload frozen artifact
        uses: actions/upload-artifact@v4
        with:
          name: attackmap-windows
          path: dist/attackmap/
          retention-days: 7

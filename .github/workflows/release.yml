name: release

# AR085 slice 2: manual-only release gate. workflow_dispatch only, no
# secrets, no publishing — slice 3 adds signing and publication on top of
# these artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-build:
    name: Reproducible build (twice + compare, AC-406)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # SOURCE_DATE_EPOCH needs only HEAD's commit timestamp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r constraints.txt

      - name: Build twice and compare
        run: python tools/build_release.py --out dist --twice --compare

      - name: Upload artifacts and manifests
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/
            dist-rebuild/release-manifest.json
          retention-days: 7

  attestation:
    name: Detached SHA-256 attestation
    runs-on: ubuntu-latest
    needs: reproducible-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

      - name: Write detached sha256 manifest
        # tools/attest_release.py is stdlib-only; this job installs nothing.
        run: python tools/attest_release.py --manifest artifacts/dist/release-manifest.json --output artifacts/release-manifest.sha256

      - name: Verify detached manifest with sha256sum
        run: cd artifacts/dist && sha256sum --check ../release-manifest.sha256

      - name: Upload attestation
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation
          path: artifacts/release-manifest.sha256
          retention-days: 7

  plugin-lock-sbom:
    name: Plugin-lock SBOM (AR011)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (lock import only, no deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps

      - name: Verify every official plugin is pinned to an immutable commit
        run: python tools/generate_release_sbom.py --check sbom.json

      - name: Upload plugin-lock SBOM
        uses: actions/upload-artifact@v4
        with:
          name: plugin-lock-sbom
          path: sbom.json
          retention-days: 7

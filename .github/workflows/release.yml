name: release

# AR085 slice 2: manual-only release gate. workflow_dispatch only, no
# secrets, no publishing — slice 3 adds signing and publication on top of
# these artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-build:
    name: Reproducible build (twice + compare, AC-406)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # SOURCE_DATE_EPOCH needs only HEAD's commit timestamp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r constraints.txt

      - name: Build twice and compare
        run: python tools/build_release.py --out dist --twice --compare

      - name: Upload artifacts and manifests
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/
            dist-rebuild/release-manifest.json
          retention-days: 7

  attestation:
    name: Detached SHA-256 attestation
    runs-on: ubuntu-latest
    needs: reproducible-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

      - name: Write detached sha256 manifest
        # tools/attest_release.py is stdlib-only; this job installs nothing.
        run: python tools/attest_release.py --manifest artifacts/dist/release-manifest.json --output artifacts/release-manifest.sha256

      - name: Verify detached manifest with sha256sum
        run: cd artifacts/dist && sha256sum --check ../release-manifest.sha256

      - name: Upload attestation
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation
          path: artifacts/release-manifest.sha256
          retention-days: 7

  sign:
    name: Sign release attestation (optional)
    runs-on: ubuntu-latest
    needs: attestation
    steps:
      - name: Explain skip when no signing key is configured
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY == '' }}
        run: |
          echo "No signing key configured; skipping the signature."
          echo "To enable: set repo variable RELEASE_SIGNING_PUBLIC_KEY (Ed25519 public PEM)"
          echo "and repo secret RELEASE_SIGNING_PRIVATE_KEY (matching PKCS8 private PEM)."
          echo "Keypairs are generated locally by: python tools/attest_release.py --manifest <m> --sign <keydir>"

      - name: Checkout
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography (signing dependency)
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42"

      - name: Download built artifacts
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

      - name: Download detached attestation
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: release-attestation
          path: artifacts/

      # --verify resolves artifact names relative to the detached manifest's
      # directory, so the detached file must sit next to the artifacts.
      - name: Place detached manifest next to the artifacts
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        run: cp artifacts/release-manifest.sha256 artifacts/dist/release-manifest.sha256

      - name: Write signing keys from configuration
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        env:
          ATTACKMAP_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          ATTACKMAP_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ATTACKMAP_SIGNING_PRIVATE_KEY}" ]; then
            echo "RELEASE_SIGNING_PUBLIC_KEY is set but RELEASE_SIGNING_PRIVATE_KEY is missing; failing instead of skipping." >&2
            exit 1
          fi
          mkdir -p signing-key
          printf '%s\n' "$ATTACKMAP_SIGNING_PUBLIC_KEY" > signing-key/release-signing-public.pem
          printf '%s\n' "$ATTACKMAP_SIGNING_PRIVATE_KEY" > signing-key/release-signing-private.pem

      - name: Sign the detached manifest
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        run: python tools/attest_release.py --manifest artifacts/dist/release-manifest.json --sign signing-key

      - name: Verify signature and artifact hashes
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        run: python tools/attest_release.py --detached artifacts/dist/release-manifest.sha256 --verify signing-key/release-signing-public.pem

      - name: Upload signature
        if: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-signature
          path: artifacts/dist/release-manifest.sha256.sig
          retention-days: 7

  plugin-lock-sbom:
    name: Plugin-lock SBOM (AR011)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (lock import only, no deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps

      - name: Verify every official plugin is pinned to an immutable commit
        run: python tools/generate_release_sbom.py --check sbom.json

      - name: Upload plugin-lock SBOM
        uses: actions/upload-artifact@v4
        with:
          name: plugin-lock-sbom
          path: sbom.json
          retention-days: 7
